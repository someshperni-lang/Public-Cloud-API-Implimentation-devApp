[project]
name = "sap_dev_uploads"
version = "2.0.0"
description = "SAP bulk uploads (DEV): the installable twin of the Streamlit DEV dashboard."
# Python 3.12: the version Flet's prebuilt Android wheels for pandas/numpy target.
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==1.0.5",
    "pandas==2.2.3",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[tool.flet]
product = "SAP bulk uploads DEV"
org = "com.incresol"
company = "Incresol"
icon_background = "#FFFFFF"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.splash]
color = "#FBFCFD"
dark_color = "#1E3A8A"

[tool.flet.boot_screen.flet]
spinner_size = 28
spinner_color_light = "#5B21B6"
startup_message = "Starting SAP bulk uploads"
prepare_message = "Preparing the app (first start only)"
